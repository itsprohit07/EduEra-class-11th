<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduEra - Class 11 Humanities</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">📚 EduEra <span>Class 11 Humanities</span></div>
    <button class="admin-btn" onclick="openAdminModal()">🔒 Admin Panel</button>
  </header>

  <main class="container">
    <section class="section">
      <h2>📌 Chapter Completion Tracker</h2>
      <div id="subjectCards" class="grid-3"></div>
    </section>

    <section class="section">
      <div class="section-header">
        <h2>📝 Detailed Short Notes</h2>
        <select id="subjectFilter" class="filter-select"></select>
      </div>
      <div id="notes" class="notes-grid"></div>
    </section>

    <section class="section">
      <h2>🎯 Chapter-wise Practice Quiz</h2>
      <div id="quiz" class="quiz-grid"></div>
    </section>

    <section class="section">
      <h2>💡 Important Doubts & Solutions</h2>
      <div id="doubts" class="doubts-grid"></div>
    </section>
  </main>

  <div id="adminModal" class="modal hidden">
    <div class="modal-content">
      <span class="close" onclick="closeAdmin()">&times;</span>
      <h3>🔒 Admin Panel Access</h3>
      
      <div id="adminAuth">
        <p>Enter Admin Password to manage materials:</p>
        <input type="password" id="adminPass" placeholder="Enter Password">
        <button onclick="saveAdmin()">Unlock Admin</button>
      </div>

      <div id="adminArea" class="hidden">
        <hr style="margin: 15px 0; border-color: rgba(255,255,255,0.1);">
        
        <h4>➕ Add New Note</h4>
        <select id="nSubject"></select>
        <select id="nChapter"></select>
        <input type="text" id="nTitle" placeholder="Note Title">
        <textarea id="nBody" placeholder="Hinglish Notes Body..." rows="4"></textarea>
        <input type="text" id="nPdf" placeholder="PDF Link (Drive / Web Link)">
        <button onclick="addNote()">Upload Note</button>

        <hr style="margin: 15px 0; border-color: rgba(255,255,255,0.1);">

        <h4>➕ Add New Doubt / Solution</h4>
        <input type="text" id="doubtTitle" placeholder="Doubt Title">
        <textarea id="doubtBody" placeholder="Detailed Solution..." rows="3"></textarea>
        <button onclick="addDoubt()">Add Doubt</button>

        <hr style="margin: 15px 0; border-color: rgba(255,255,255,0.1);">

        <h4>➕ Add Quiz Question</h4>
        <select id="qSubject"></select>
        <select id="qChapter"></select>
        <input type="text" id="qText" placeholder="Question Text">
        <input type="text" id="a0" placeholder="Option 1">
        <input type="text" id="a1" placeholder="Option 2">
        <input type="text" id="a2" placeholder="Option 3">
        <input type="text" id="a3" placeholder="Option 4">
        <select id="qAnswer">
          <option value="0">Correct: Option 1</option>
          <option value="1">Correct: Option 2</option>
          <option value="2">Correct: Option 3</option>
          <option value="3">Correct: Option 4</option>
        </select>
        <input type="text" id="qExplanation" placeholder="Explanation">
        <button onclick="addQuiz()">Add Quiz Question</button>

        <hr style="margin: 15px 0; border-color: rgba(255,255,255,0.1);">

        <div id="adminNotesList"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
